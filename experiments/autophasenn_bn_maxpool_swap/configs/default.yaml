data:
  mode: memmap
  data_dir: /data_ssd/oyys/autophasenn
  diff_file: val_diff.npy
  real_file: val_real.npy
  num_samples: 5000
  shape: [64, 64, 64]
  dtype_diff: float32
  dtype_real: complex64
  scale_i: 0.0
  random_distribution: uniform
  random_min: 0.0
  random_max: 1.0
  random_seed: 20260803

model:
  checkpoint: REPLACE_WITH_PRETRAINED_CHECKPOINT.pt
  threshold: null
  strict_load: true
  allow_unsafe_checkpoint: false

runtime:
  device: cuda
  batch_size: 1
  num_workers: 0
  seed: 20260708
  deterministic: true
  hash_checkpoint: true
  log_level: INFO

metrics:
  amplitude_data_range: 1.0
  ssim_window_size: 7
  histogram_bins: 64

statistics:
  bootstrap_samples: 2000
  confidence_level: 0.95
  seed: 20260708

acceptance:
  primary_metrics:
    - paper_modulus_mae
    - real_amp_psnr
    - real_amp_ssim3d
    - real_phase_mae_true_support
  max_primary_metric_degradation_percent: 1.0
  max_farfield_relative_l1: 0.001
  min_positive_bn_scale_fraction: 1.0

output:
  root_dir: experiments/autophasenn_bn_maxpool_swap/outputs
  run_name: null
